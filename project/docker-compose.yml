x-environment: &api-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  JWT_ACCESS_TOKEN_EXPIRES_IN: 604800s
  JWT_REFRESH_TOKEN_EXPIRES_IN: 5184000s
  CORS_ENABLED: ${CORS_ENABLED:-false}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-false}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
  CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-GET,POST,PUT,DELETE,PATCH,OPTIONS}
  CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-Content-Type,Authorization,X-Requested-With,Accept,Origin}
  CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
  CORS_EXPOSE_HEADERS: ${CORS_EXPOSE_HEADERS:-}

services:
  sobagent-user-service:
    build:
      context: ./backend/user_service
      args:
        GIT_PERSONAL_ACCESS_TOKEN: ${GIT_PERSONAL_ACCESS_TOKEN}
        GIT_USERNAME: ${GIT_USERNAME}
    container_name: sobagent-user-service
    env_file:
      - ./.env
    environment:
      <<: *api-env
      PSQL_DB_PASSWORD: ${PSQL_DB_PASSWORD}
      PSQL_DB_HOST: postgres
      PSQL_DB_PORT: "5433"
      PSQL_DB_SCHEMA: user_service_schema
      PSQL_DB_USERNAME: app
      PSQL_DB_NAME: sobagent_db
      PSQL_DB_SSL_MODE: disable
      SERVER_PORT: "8080"
      SERVER_HOST: 0.0.0.0
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network
      - gateway_network

  sobagent-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: sobagent-frontend
    expose:
      - "80"
    depends_on:
      - sobagent-user-service
    networks:
      - gateway_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: sobagent-postgres
    environment:
      POSTGRES_DB: sobagent_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${PSQL_DB_PASSWORD}
      PGPORT: "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/postgres_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sobagent_db -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge
  gateway_network:
    external: true

volumes:
  postgres_data:
